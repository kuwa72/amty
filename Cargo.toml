[package]
name = "amty"
version = "0.1.0"
edition = "2021"
description = "amty - lightweight scriptable AI chat & agent client"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "7"
eframe = "0.36"
egui_commonmark = "0.25"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
