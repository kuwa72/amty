[package]
name = "amty"
version = "0.1.0"
edition = "2021"
description = "amty - lightweight scriptable AI chat & agent client"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "7"
eframe = "0.36"
egui_commonmark = "0.25"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11.0"
base64 = "0.23.1"

[profile.release]
# thin LTO + default codegen-units: fat LTO + cu=1 made the final crate
# spend ~5 min in rustc/LLVM; a GUI client doesn't need that last %.
lto = "thin"
strip = true
