name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install mingw-w64 (linker + windres for the exe icon)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 binutils-mingw-w64
      - name: Build Linux binary
        run: cargo build --release
      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -czf "dist/amty-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release amty
          cd target/x86_64-pc-windows-gnu/release
          zip "$OLDPWD/dist/amty-${GITHUB_REF_NAME}-windows-x86_64.zip" amty.exe
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
